<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center text-success mb-4">All Product Records</h2>

    <div th:if="${msg}" class="alert alert-info" role="alert" th:text="${msg}"></div>

    <table class="table table-bordered table-striped shadow-sm">
        <thead class="table-dark text-center">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price (₹)</th>
            <th>Quantity</th>
            <th>Action</th> <!-- New column -->
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}" class="text-center">
            <td th:text="${product.id}">1</td>
            <td th:text="${product.name}">Pen</td>
            <td th:text="${product.price}">10</td>
            <td th:text="${product.quantity}">100</td>

            <td>
                <a th:href="@{/edit(id=${product.id})}" class="btn btn-primary btn-sm"
                   onclick="return confirm('Are you sure you want to edit this product?')">Edit</a>

                <a th:href="@{/delete(id=${product.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="text-center mt-4">
        <a th:href="@{/}" class="btn btn-primary">➕ Add New Product</a>
    </div>
</div>

</body>
</html>
