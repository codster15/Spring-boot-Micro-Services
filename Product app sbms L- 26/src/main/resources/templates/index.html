<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Entry Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <!-- Heading -->
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">Product Entry Form</h2>
            </div>

            <!-- Alert message -->
            <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${msg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Form -->
            <form th:action="@{/save}" th:object="${product}" method="post" class="border rounded p-4 bg-white shadow-sm">

                <!-- ✅ Add this line -->
                <input type="hidden" th:field="*{id}" />
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Product Name</label>
                    <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Enter product name">
                    <div th:if="${#fields.hasErrors('name')}" class="text-danger small mt-1">
                        <p th:errors="*{name}">Name Error</p>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label fw-semibold">Price (₹)</label>
                    <input type="number" th:field="*{price}" class="form-control" id="price" placeholder="Enter price">
                    <div th:if="${#fields.hasErrors('price')}" class="text-danger small mt-1">
                        <p th:errors="*{price}">Price Error</p>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="quantity" class="form-label fw-semibold">Quantity</label>
                    <input type="number" th:field="*{quantity}" class="form-control" id="quantity" placeholder="Enter quantity">
                    <div th:if="${#fields.hasErrors('quantity')}" class="text-danger small mt-1">
                        <p th:errors="*{quantity}">Quantity Error</p>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <a th:href="@{/}" class="btn btn-outline-secondary">Reset Form</a>
                </div>
            </form>


            <!-- View Records Link -->
            <div class="text-center mt-4">
                <a th:href="@{/viewProducts}" class="btn btn-info w-100">📋 View All Products</a>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS for alert dismissal -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
